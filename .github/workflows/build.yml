name: bun-no-sse42

# Build Bun from source with an x86-64 CPU baseline that has neither SSE4.2
# nor AVX. Upstream x64 is compiled with -march=nehalem (SSE4.2, no AVX); this
# rewrites scripts/build/flags.ts so Bun, every vendored dependency and
# WebKit/JavaScriptCore are built for a lower target: default x86-64 (SSE2),
# which needs neither.
#
# The build runs inside the latest Arch Linux container. Arch ships one LLVM
# (22.x as of this writing) and the current glibc, so the resulting binary is
# not portable to older distributions; use the long_glibc input with a glibc
# 2.31 sysroot if you need that, or build on the target machine's distro.
#
# WebKit is built from source, not downloaded: oven-sh/WebKit's prebuilt
# archives are themselves built with -march=nehalem and would still use SSE4.2.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      march:
        description: LLVM CPU target (must have neither SSE4.2 nor AVX)
        type: choice
        default: x86-64
        options: [x86-64, core2, penryn]
      bun_commit:
        description: oven-sh/bun commit to build
        type: string
        default: 6d504dd983bd6017c9baa5087066afefbee70e66
      webkit_commit:
        description: oven-sh/WebKit commit (WEBKIT_VERSION in scripts/build/deps/webkit.ts)
        type: string
        default: 299c5323879e79af282d7bb7bac8b8446a0be3f3
      long_glibc:
        description: Link against bun's ubuntu-20.04 glibc 2.31 sysroot (experimental)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  MARCH: ${{ github.event.inputs.march || 'x86-64' }}
  BUN_COMMIT: ${{ github.event.inputs.bun_commit || '6d504dd983bd6017c9baa5087066afefbee70e66' }}
  WEBKIT_COMMIT: ${{ github.event.inputs.webkit_commit || '299c5323879e79af282d7bb7bac8b8446a0be3f3' }}
  LONG_GLIBC: ${{ github.event.inputs.long_glibc || 'false' }}
  RUSTUP_TOOLCHAIN: nightly-2026-09-15

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --user root
    timeout-minutes: 350
    steps:
      - name: Prepare Arch and check disk
        run: |
          set -eux
          mount -o remount,size=52G /tmp || true
          # python is /usr/bin/python; flang provides a source-language
          # compiler so LLVM's CMake accepts the host as a stage-1 toolchain.
          pacman -Syu --noconfirm --needed \
            base-devel bash ca-certificates ccache cmake curl git go icu libtool \
            ninja pkgconf python ruby unzip wget xz flang
          df -h / /tmp
          nproc

      - name: Work out the C library floor
        run: |
          set -eux
          glibc=$(pacman -Q glibc | awk '{print $2}')
          echo "GLIBC_VERSION=$glibc" >> "$GITHUB_ENV"
          echo "Arch glibc is $glibc"

      - name: Free the runner's disk
        run: |
          rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet \
                 /opt/ghc /usr/local/ghc /opt/hostedtoolcache/CodeQL \
                 /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          set -eux
          # Arch tracks the latest LLVM; Bun pins 23.1.1 and refuses anything
          # else, so LLVM 23 is built from source into /opt/llvm23 and the
          # build is told to use it with BUN_TOOLCHAIN_LLVM. Arch's llvm is
          # kept as the stage-1 compiler for that build.
          pacman -S --noconfirm --needed llvm clang lld nasm
          clang --version | head -1
          sh ci/build-llvm23.sh
          /opt/llvm23/bin/clang --version | head -1
          echo "BUN_TOOLCHAIN_LLVM=/opt/llvm23" >> "$GITHUB_ENV"
          echo "/opt/llvm23/bin" >> "$GITHUB_PATH"

      - name: Install Rust nightly
        run: |
          set -eux
          export CARGO_HOME=$HOME/.cargo RUSTUP_HOME=$HOME/.rustup
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          . "$CARGO_HOME/env"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal \
            --component rust-src --component llvm-tools --no-self-update
          rustc --version

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: arch-bun-${{ env.MARCH }}-${{ env.BUN_COMMIT }}
          max-size: 5G

      - name: Install Bun (bootstrap)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Checkout Bun
        run: |
          set -eux
          mkdir bun-src
          cd bun-src
          git init -q
          git remote add origin https://github.com/oven-sh/bun.git
          git fetch --depth 1 origin "$BUN_COMMIT"
          git checkout -q --detach FETCH_HEAD
          git rev-parse HEAD
          git config --global --add safe.directory "$PWD"

      - name: Patch CPU target to ${{ env.MARCH }}
        run: |
          set -eux
          cd bun-src
          sed -i "s/-march=nehalem/-march=${MARCH}/" scripts/build/flags.ts
          grep -n 'march=' scripts/build/flags.ts

      - name: Checkout WebKit
        run: |
          set -eux
          mkdir -p bun-src/vendor/WebKit
          cd bun-src/vendor/WebKit
          git init -q
          git remote add origin https://github.com/oven-sh/WebKit.git
          git fetch --depth 1 origin "$WEBKIT_COMMIT"
          git checkout -q --detach FETCH_HEAD
          git rev-parse HEAD
          git config --global --add safe.directory "$PWD"

      - name: Provision glibc 2.31 sysroot
        if: env.LONG_GLIBC == 'true'
        run: bash ci/provision-glibc-sysroot.sh
      - name: Build Bun
        working-directory: bun-src
        env:
          LINUX_GLIBC_SYSROOT: ${{ env.LONG_GLIBC == 'true' && '/opt/linux-sysroot-glibc' || '' }}
        run: |
          set -eux
          . "$CARGO_HOME/env"
          bun install || bun install --no-save
          bun run build:release:local
          ./build/release-local/bun --version

      - name: Stage artifact
        if: always()
        run: |
          set -eux
          mkdir -p out
          if [ -f bun-src/build/release-local/bun ]; then
            cp bun-src/build/release-local/bun out/bun
            chmod +x out/bun
            cp -L /etc/os-release out/os-release-arch.txt || true
            ldd out/bun | tee out/ldd.txt || true
            # Linux local-WebKit builds link the system ICU dynamically.
            # Ship it so the binary does not need Arch's libicu at runtime.
            for lib in $(ldd out/bun | awk '/libicu/{print $3}'); do
              [ -f "$lib" ] && cp -L "$lib" out/
            done
          fi
          ls -la out

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-linux-x64-${{ env.MARCH }}
          path: out/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Verify under QEMU (no SSE4.2, no AVX)
        if: always()
        continue-on-error: true
        run: |
          set -eux
          pacman -Sy --noconfirm --needed qemu-user || pacman -S --noconfirm --needed qemu-user
          case "$MARCH" in
            x86-64) CPU=qemu64 ;;
            core2) CPU=core2duo ;;
            penryn) CPU=penryn ;;
            *) CPU=qemu64 ;;
          esac
          export LD_LIBRARY_PATH="$PWD/out"
          ./out/bun --version
          qemu-x86_64 -cpu "$CPU" ./out/bun --version
          qemu-x86_64 -cpu "$CPU" ./out/bun -e 'console.log("ok", [1,2,3].map(x => x * 2).join(","))'
