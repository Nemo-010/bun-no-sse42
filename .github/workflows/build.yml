name: bun-no-sse42

# Build Bun from source with an x86-64 CPU baseline that has neither SSE4.2
# nor AVX. Upstream x64 is compiled with -march=nehalem (SSE4.2, no AVX); this
# rewrites scripts/build/flags.ts so Bun, every vendored dependency and
# WebKit/JavaScriptCore are built for a lower target: default x86-64 (SSE2),
# which needs neither.
#
# The build runs in Ubuntu 24.04, the distribution Bun's own build scripts and
# documentation assume. That keeps the toolchain install to apt plus
# apt.llvm.org, and it is the environment the build is actually tested in.
#
# WebKit is built from source, not downloaded: oven-sh/WebKit's prebuilt
# archives are themselves built with -march=nehalem and would still use SSE4.2.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      march:
        description: LLVM CPU target (must have neither SSE4.2 nor AVX)
        type: choice
        default: x86-64
        options: [x86-64, core2, penryn]
      bun_commit:
        description: oven-sh/bun commit to build
        type: string
        default: 6d504dd983bd6017c9baa5087066afefbee70e66
      webkit_commit:
        description: oven-sh/WebKit commit (WEBKIT_VERSION in scripts/build/deps/webkit.ts)
        type: string
        default: 299c5323879e79af282d7bb7bac8b8446a0be3f3
      long_glibc:
        description: Link against bun's ubuntu-20.04 glibc 2.31 sysroot (experimental)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  MARCH: ${{ github.event.inputs.march || 'x86-64' }}
  BUN_COMMIT: ${{ github.event.inputs.bun_commit || '6d504dd983bd6017c9baa5087066afefbee70e66' }}
  WEBKIT_COMMIT: ${{ github.event.inputs.webkit_commit || '299c5323879e79af282d7bb7bac8b8446a0be3f3' }}
  LONG_GLIBC: ${{ github.event.inputs.long_glibc || 'false' }}
  RUSTUP_TOOLCHAIN: nightly-2026-09-15
  # LLVM 23.1.1, the version Bun's build accepts. See ci/install-llvm23.sh.
  LLVM_MAJOR: "23"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space and report it
        run: |
          set -eux
          df -h / /mnt
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet \
                      /opt/ghc /usr/local/ghc "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_MAJOR }}
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg lsb-release software-properties-common
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-$LLVM_MAJOR main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-$LLVM_MAJOR lld-$LLVM_MAJOR llvm-$LLVM_MAJOR libclang-rt-$LLVM_MAJOR-dev
          # Bun looks for clang-23, /usr/lib/llvm-23/bin and a plain clang, in
          # that order, so all three have to lead to the same 23.x.
          echo "BUN_TOOLCHAIN_LLVM=/usr/lib/llvm-$LLVM_MAJOR" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-$LLVM_MAJOR/bin" >> "$GITHUB_PATH"
          /usr/lib/llvm-$LLVM_MAJOR/bin/clang --version | head -1
          /usr/lib/llvm-$LLVM_MAJOR/bin/ld.lld --version

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake git golang libatomic1 libicu-dev \
            libtool ninja-build pkg-config python3 ruby ruby-erb unzip wget xz-utils nasm
          ruby -e 'require "erb"; puts "ruby erb ok"'

      - name: Install Rust
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          . "$HOME/.cargo/env"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal \
            --component rust-src --component llvm-tools --no-self-update
          rustc --version

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ubuntu-bun-${{ env.MARCH }}-${{ env.BUN_COMMIT }}
          max-size: 5G

      - name: Install Bun (bootstrap)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Checkout Bun
        run: |
          set -eux
          mkdir bun-src
          cd bun-src
          git init -q
          git remote add origin https://github.com/oven-sh/bun.git
          git fetch --depth 1 origin "$BUN_COMMIT"
          git checkout -q --detach FETCH_HEAD
          git rev-parse HEAD

      - name: Patch the CPU target to ${{ env.MARCH }}
        run: |
          set -eux
          cd bun-src
          sed -i "s/-march=nehalem/-march=${MARCH}/" scripts/build/flags.ts
          grep -n 'march=' scripts/build/flags.ts

      - name: Drop vendored code above the CPU floor
        run: |
          set -eux
          cd bun-src
          # -march=x86-64 leaves out SSE4.1, which upstream's nehalem floor has,
          # and one vendored file asks for it unconditionally: libspng compiles
          # its defilter helpers with -msse4.1 under SPNG_SSE=4. clang refuses
          # to inline _mm_blendv_epi8 at all under a lower target (it is not a
          # branch, unlike -mavx2, which clang does quietly emit), so this is a
          # hard error rather than an instruction that only runs after a cpuid
          # check. 2 selects the SSE2 path, which is what the flag has enums
          # for: spng.h documents SPNG_SSE as 1=SSE2, 2=SSSE3, 3=SSE4.1, 4=SSE4.1.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("scripts/build/deps/libspng.ts")
          s = p.read_text()
          before = s
          s = s.replace("SPNG_SSE: 4", "SPNG_SSE: 2")
          s = s.replace("4 = SSE4.1 defilter paths (pabsw/pblendvb); our x64 floor is nehalem.",
                        "2 = SSSE3 defilter paths; the x64 floor here is below nehalem (no SSE4.1).")
          assert s != before, "libspng's SPNG_SSE define was not found"
          p.write_text(s)
          PY
          grep -n 'SPNG_SSE' scripts/build/deps/libspng.ts
        run: |
          set -eux
          mkdir -p bun-src/vendor/WebKit
          cd bun-src/vendor/WebKit
          git init -q
          git remote add origin https://github.com/oven-sh/WebKit.git
          git fetch --depth 1 origin "$WEBKIT_COMMIT"
          git checkout -q --detach FETCH_HEAD
          git rev-parse HEAD

      - name: Checkout WebKit
        run: |
          set -eux
          mkdir -p bun-src/vendor/WebKit
          cd bun-src/vendor/WebKit
          git init -q
          git remote add origin https://github.com/oven-sh/WebKit.git
          git fetch --depth 1 origin "$WEBKIT_COMMIT"
          git checkout -q --detach FETCH_HEAD
          git rev-parse HEAD

      - name: Provision glibc 2.31 sysroot
        if: env.LONG_GLIBC == 'true'
        run: bash ci/provision-glibc-sysroot.sh

      - name: Build Bun
        working-directory: bun-src
        env:
          LINUX_GLIBC_SYSROOT: ${{ env.LONG_GLIBC == 'true' && '/opt/linux-sysroot-glibc' || '' }}
        run: |
          set -eux
          . "$HOME/.cargo/env"
          bun install --frozen-lockfile || bun install
          bun run build:release:local
          ./build/release-local/bun --version

      - name: Stage artifact
        if: always()
        run: |
          set -eux
          mkdir -p out
          if [ -f bun-src/build/release-local/bun ]; then
            cp bun-src/build/release-local/bun out/bun
            chmod +x out/bun
            cp -L /etc/os-release out/os-release.txt || true
            ldd out/bun | tee out/ldd.txt || true
            # Linux local-WebKit builds link the system ICU dynamically.
            # Ship it so the binary does not need the runner's libicu.
            for lib in $(ldd out/bun | awk '/libicu/{print $3}'); do
              [ -f "$lib" ] && cp -L "$lib" out/
            done
          fi
          ls -la out

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-linux-x64-${{ env.MARCH }}
          path: out/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      - name: Verify under QEMU (no SSE4.2, no AVX)
        if: always()
        continue-on-error: true
        run: |
          set -eux
          sudo apt-get install -y --no-install-recommends qemu-user
          case "$MARCH" in
            x86-64) CPU=qemu64 ;;
            core2) CPU=core2duo ;;
            penryn) CPU=penryn ;;
            *) CPU=qemu64 ;;
          esac
          export LD_LIBRARY_PATH="$PWD/out"
          ./out/bun --version
          qemu-x86_64 -cpu "$CPU" ./out/bun --version
          qemu-x86_64 -cpu "$CPU" ./out/bun -e 'console.log("ok", [1,2,3].map(x => x * 2).join(","))'
